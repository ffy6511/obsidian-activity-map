name: Bug report
description: Report a reproducible problem in Activity Map.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Activity Map. Please remove private note content and personal paths from the report.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the unexpected behavior and its impact.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence.
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead?
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Activity Map version
      placeholder: "0.2.1"
    validations:
      required: true
  - type: input
    id: obsidian-version
    attributes:
      label: Obsidian version and platform
      placeholder: "1.x.x on macOS / Windows / Linux / mobile"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console errors or screenshots
      description: Optional. Redact private paths and note content first.
