name: Publish release

on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Semantic version to validate; used as the source tag only when publishing
        required: true
        type: string
      publish_release:
        description: Create or recover the GitHub Release after validation succeeds
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish release assets
    runs-on: ubuntu-latest

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          # A manual dry-run validates the branch that owns this workflow. A
          # release recovery switches to the immutable tag only when explicitly
          # authorized to create the GitHub Release.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release && inputs.release_tag || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.4.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync } from 'node:fs';

          const readJson = (path) => JSON.parse(readFileSync(path, 'utf8'));
          const tag = process.env.RELEASE_TAG;
          const packageJson = readJson('package.json');
          const manifest = readJson('manifest.json');
          const versions = readJson('versions.json');
          const semver = /^\d+\.\d+\.\d+(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/;

          if (!semver.test(tag)) throw new Error(`Release tag must be a semantic version without a prefix: ${tag}`);
          if (packageJson.version !== tag) throw new Error(`package.json version ${packageJson.version} does not match tag ${tag}`);
          if (manifest.version !== tag) throw new Error(`manifest.json version ${manifest.version} does not match tag ${tag}`);
          if (versions[tag] !== manifest.minAppVersion) {
            throw new Error(`versions.json must map ${tag} to minAppVersion ${manifest.minAppVersion}`);
          }
          EOF

      - name: Type-check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Run tests
        shell: bash
        run: |
          runner_path="$RUNNER_TEMP/activity-map-run-test-file.mjs"
          cat > "$runner_path" <<'EOF'
          import path from 'node:path';
          import { createRequire } from 'node:module';
          import { pathToFileURL } from 'node:url';

          const [testPath] = process.argv.slice(2);
          if (!testPath) throw new Error('Expected a test-file path');

          const root = process.cwd();
          const require = createRequire(path.join(root, 'package.json'));
          const { createJiti } = require('jiti');
          const jiti = createJiti(pathToFileURL(path.join(root, 'package.json')).href);
          await jiti.import(pathToFileURL(path.resolve(root, testPath)).href);
          const harness = await jiti.import(path.join(root, 'tests/helpers/test-harness.ts'));
          const result = await harness.runRegisteredTests();
          console.log(`Tests in ${testPath}: ${result.passed} passed, ${result.failed} failed`);
          process.exit(result.failed === 0 ? 0 : 1);
          EOF

          while IFS= read -r test_file; do
            echo "Running $test_file"
            timeout --signal=TERM --kill-after=5s 60s node "$runner_path" "$test_file"
          done < <(find tests -name '*.test.ts' -print | sort)

      - name: Build production bundle
        run: npm run build

      - name: Verify release assets
        run: |
          test -s main.js
          test -s manifest.json
          test -s styles.css

      - name: Create GitHub release
        if: ${{ github.event_name == 'push' || inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" main.js manifest.json styles.css \
            --repo "$GITHUB_REPOSITORY" \
            --title "Activity Map $RELEASE_TAG" \
            --generate-notes
